<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>XXD Panel 005</title>
  <desc>Fairy-tale print structural narrative: one or two blunt masses inside a source-grown dark field, pale negative space, tiny saturated signals, screenprint and powdery pastel, with five-language documentation.</desc>
  <defs>
    <clipPath id="frame"><rect width="1200" height="400" rx="30"/></clipPath>
    <pattern id="paper" width="34" height="30" patternUnits="userSpaceOnUse">
      <path d="M3 7L14 5M21 23L31 20M7 28L13 27" stroke="#2B312B" stroke-opacity=".065" stroke-width=".8"/>
      <circle cx="24" cy="9" r=".75" fill="#2B312B" fill-opacity=".075"/>
    </pattern>
    <pattern id="ink" width="17" height="17" patternUnits="userSpaceOnUse">
      <path d="M0 3L17 1M0 8L17 6M0 14L17 11" stroke="#ECE7D2" stroke-opacity=".075" stroke-width="1.4"/>
      <circle cx="5" cy="12" r=".8" fill="#ECE7D2" fill-opacity=".08"/>
    </pattern>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".011 .045" numOctaves="2" seed="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="powder" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".38" numOctaves="2" seed="8" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="multiply"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#ECE7D2"/>
    <rect width="1200" height="400" fill="url(#paper)"/>
    <path d="M704 -28C798 16 824 65 852 118C887 184 946 183 1008 212C1093 252 1154 313 1233 393L1238 -26Z" fill="#28332E" filter="url(#rough)"/>
    <path d="M704 -28C798 16 824 65 852 118C887 184 946 183 1008 212C1093 252 1154 313 1233 393L1238 -26Z" fill="url(#ink)"/>
    <path d="M733 296C789 253 802 204 838 174C874 144 929 148 960 183C994 220 986 276 947 315C902 361 818 373 748 345Z" fill="#EEE9D7" filter="url(#rough)"/>
    <path d="M772 306C788 248 818 199 860 181C899 165 939 187 950 224C961 262 938 298 902 323C865 348 817 345 772 306Z" fill="#B9C7B4" fill-opacity=".9" filter="url(#powder)"/>
    <path d="M798 312C790 270 808 221 844 201C873 185 908 197 923 226C941 260 922 299 892 322C862 345 823 340 798 312Z" fill="#ECE7D2"/>
    <path d="M802 311C793 270 811 225 844 206C873 190 905 201 918 229C933 259 918 294 890 316C862 338 826 336 802 311Z" stroke="#28332E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>
    <path d="M830 230C846 237 858 250 865 267M816 267C838 273 860 271 883 260M830 301C848 291 869 286 893 289" stroke="#28332E" stroke-width="2.2" stroke-linecap="round" filter="url(#rough)"/>
    <circle cx="847" cy="231" r="5.5" fill="#F05243"/>
    <path d="M954 177C992 192 1015 219 1022 257" stroke="#F4BF2E" stroke-width="13" stroke-linecap="round" filter="url(#powder)"/>
    <path d="M748 345C786 359 830 360 873 350" stroke="#F05243" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 15"/>
    <path d="M1072 274C1098 253 1126 246 1155 251L1144 301C1118 292 1097 294 1073 309Z" fill="#4CB9B3" filter="url(#powder)"/>
    <rect x="1039" y="84" width="112" height="42" rx="8" fill="#F4BF2E" filter="url(#rough)"/>
    <text x="1095" y="110" text-anchor="middle" fill="#28332E" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.2">STORY SIGNAL</text>

    <text x="1034" y="37" text-anchor="end" fill="#ECE7D2" fill-opacity=".78" font-family="Arial, sans-serif" font-size="11" font-weight="700">中文 · EN · 日本語 · 한국어 ·</text>
    <text x="1132" y="37" text-anchor="end" direction="rtl" fill="#ECE7D2" fill-opacity=".78" font-family="Arial, sans-serif" font-size="11" font-weight="700">العربية</text>
  </g>

  <g transform="translate(64 55)">
    <rect width="223" height="34" rx="8" fill="#28332E" filter="url(#rough)"/>
    <text x="18" y="22" fill="#ECE7D2" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">🦁 XXD / IMAGE SKILL</text>
    <text x="0" y="116" fill="#28332E" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-4">PANEL <tspan fill="#F05243">005</tspan></text>
    <text x="2" y="157" fill="#28332E" font-family="Arial, sans-serif" font-size="19" font-weight="900" letter-spacing=".8">DARK FIELD · PARTIAL REVEAL · STORY SIGNAL</text>
    <text x="2" y="194" fill="#28332E" font-family="sans-serif" font-size="18" font-weight="800">童话版画结构叙事 · 暗场包裹亮色信号</text>
    <text x="2" y="222" fill="#28332E" fill-opacity=".73" font-family="sans-serif" font-size="14" font-weight="700">童話版画の構造物語 · 동화 판화 구조 서사</text>
    <text x="2" y="250" fill="#28332E" fill-opacity=".73" font-family="Arial, sans-serif" font-size="14" font-weight="700">حكاية مطبوعة ببنية داكنة وإشارات ساطعة</text>
  </g>

  <g transform="translate(64 327)">
    <rect width="153" height="37" rx="7" fill="#28332E" filter="url(#rough)"/>
    <text x="76.5" y="24" text-anchor="middle" fill="#ECE7D2" font-family="Courier New, monospace" font-size="12" font-weight="900">SOURCE-BOUND</text>
    <rect x="165" width="102" height="37" rx="7" fill="#F05243" filter="url(#rough)"/>
    <text x="216" y="24" text-anchor="middle" fill="#ECE7D2" font-family="Courier New, monospace" font-size="12" font-weight="900">4 MODES</text>
    <rect x="279" width="180" height="37" rx="7" fill="#4CB9B3" filter="url(#rough)"/>
    <text x="369" y="24" text-anchor="middle" fill="#28332E" font-family="Courier New, monospace" font-size="12" font-weight="900">WALLPAPER PACK</text>
    <rect x="471" width="147" height="37" rx="7" fill="#F4BF2E" filter="url(#rough)"/>
    <text x="544.5" y="24" text-anchor="middle" fill="#28332E" font-family="Courier New, monospace" font-size="12" font-weight="900">RASTER ONLY</text>
  </g>
</svg>
